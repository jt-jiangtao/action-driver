syntax = "proto3";

package actiondriver.runtime.v1;

option go_package = "github.com/actiondriver/action-driver/services/agentd/internal/gen/actiondriver/runtime/v1;runtimev1";

import "google/protobuf/timestamp.proto";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;
  ERROR_CODE_PROTOCOL_INCOMPATIBLE = 2;
  ERROR_CODE_CAPABILITY_UNAVAILABLE = 3;
  ERROR_CODE_INVALID_COMMAND = 4;
}

enum SkillState {
  SKILL_STATE_UNSPECIFIED = 0;
  SKILL_STATE_QUEUED = 1;
  SKILL_STATE_DISPATCHED = 2;
  SKILL_STATE_RUNNING = 3;
  SKILL_STATE_WAITING_FOR_USER = 4;
  SKILL_STATE_SUCCEEDED = 5;
  SKILL_STATE_CANCELLED = 6;
  SKILL_STATE_FAILED = 7;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_WAITING_FOR_USER = 3;
  TASK_STATE_SUCCEEDED = 4;
  TASK_STATE_CANCELLED = 5;
  TASK_STATE_FAILED = 6;
}

message RequestContext {
  string request_id = 1;
  string session_token = 2;
  string client_version = 3;
  google.protobuf.Timestamp sent_at = 4;
}

message RuntimeError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> details = 4;
}

message Capability {
  string skill_id = 1;
  string contract_version = 2;
}

message HandshakeRequest {
  RequestContext context = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
  repeated Capability capabilities = 4;
}

message HandshakeResponse {
  string request_id = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
  string runtime_version = 4;
  repeated Capability capabilities = 5;
  RuntimeError error = 6;
}

message HealthRequest {
  RequestContext context = 1;
}

message HealthResponse {
  string request_id = 1;
  bool ready = 2;
  string runtime_version = 3;
}

message ShutdownRequest {
  RequestContext context = 1;
}

message ShutdownResponse {
  string request_id = 1;
  bool accepted = 2;
}

message SubmitGoalRequest {
  RequestContext context = 1;
  string task_id = 2;
  string goal = 3;
}

message InterruptTaskRequest {
  RequestContext context = 1;
  string task_id = 2;
}

message InterruptTaskResponse {
  string request_id = 1;
  string task_id = 2;
  RuntimeError error = 3;
}

message ContinueTaskRequest {
  RequestContext context = 1;
  string task_id = 2;
}

message ContinueTaskResponse {
  string request_id = 1;
  string task_id = 2;
  RuntimeError error = 3;
}

message SubmitGoalResponse {
  string request_id = 1;
  string task_id = 2;
  RuntimeError error = 3;
}

message TaskProjection {
  string task_id = 1;
  string goal = 2;
  TaskState state = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message AgentMessageProjection {
  string message_id = 1;
  string task_id = 2;
  string role = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ExecutionStepProjection {
  string step_id = 1;
  string task_id = 2;
  string title = 3;
  string summary = 4;
  SkillState state = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message SkillInvocation {
  string invocation_id = 1;
  string task_id = 2;
  string skill_id = 3;
  string contract_version = 4;
  SkillState state = 5;
  bytes input = 6;
  bytes output = 7;
  RuntimeError error = 8;
}

message RuntimeEvent {
  uint64 cursor = 1;
  string event_id = 2;
  string request_id = 3;
  string task_id = 4;
  string event_type = 5;
  google.protobuf.Timestamp occurred_at = 6;
  oneof payload {
    TaskProjection task = 7;
    AgentMessageProjection message = 8;
    ExecutionStepProjection step = 9;
    SkillInvocation skill_invocation = 10;
  }
}

message SubscribeRequest {
  RequestContext context = 1;
  uint64 after_cursor = 2;
  string task_id = 3;
}

message SubscribeResponse {
  RuntimeEvent event = 1;
}

message ProviderRegistration {
  RequestContext context = 1;
  string provider_id = 2;
  repeated Capability capabilities = 3;
}

message ExecuteRequest {
  oneof payload {
    ProviderRegistration registration = 1;
    SkillInvocation update = 2;
  }
}

message ExecuteResponse {
  oneof payload {
    SkillInvocation invocation = 1;
    RuntimeError error = 2;
  }
}

message RuntimeContractFixture {
  RequestContext context = 1;
  HandshakeResponse handshake = 2;
  RuntimeError error = 3;
  SkillInvocation invocation = 4;
  RuntimeEvent event = 5;
}

service RuntimeControlService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

service AgentCommandService {
  rpc SubmitGoal(SubmitGoalRequest) returns (SubmitGoalResponse);
  rpc InterruptTask(InterruptTaskRequest) returns (InterruptTaskResponse);
  rpc ContinueTask(ContinueTaskRequest) returns (ContinueTaskResponse);
}

service RuntimeEventsService {
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

service SkillProviderService {
  rpc Execute(stream ExecuteRequest) returns (stream ExecuteResponse);
}
